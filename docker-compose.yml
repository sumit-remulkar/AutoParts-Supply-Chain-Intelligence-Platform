services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ascip_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ascip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ascip}
      POSTGRES_DB: ${POSTGRES_DB:-ascip}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ascip}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: ascip_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ascip}:${POSTGRES_PASSWORD:-ascip}@db:5432/${POSTGRES_DB:-ascip}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: ascip_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  pgdata:
